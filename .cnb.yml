# CNB cloud pipeline: mirror CNB main -> GitHub (GwoApps/jp-lyrics-app)
# Triggered on every push to main; runs entirely on CNB cloud.
# GitHub credentials come from the secret repo siubeng/secrets (secret-env.yml).
main:
  push:
    - imports: https://cnb.cool/siubeng/secrets/-/blob/main/secret-env.yml
      stages:
        - name: sync to github
          image: tencentcom/git-sync
          settings:
            target_url: https://github.com/GwoApps/jp-lyrics-app.git
            auth_type: https
            username: ${GIT_USERNAME}
            password: ${GIT_ACCESS_TOKEN}
            branch: main

# Static checks on pull requests: i18n key validation + unit tests + lint.
$:
  pull_request:
    - name: i18n & tests
      docker:
        image: node:22
        volumes:
          - node_modules
      stages:
        - name: install
          script: npm ci --frozen-lockfile
        - name: validate i18n keys
          script: npm run validate:i18n
        - name: test
          script: npm test
          allowFailure: true
        - name: lint
          script: npm run lint
          allowFailure: true
