services:
  jplrc:
    build: .
    container_name: jplrc
    restart: unless-stopped
    env_file: .env
    environment:
      - YT_MUSIC_SIDECAR_URL=http://yt-sidecar:8910
    volumes:
      - jplrc-data:/app/data
    depends_on:
      - yt-sidecar
    networks:
      - traefik-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.jplrc.loadbalancer.server.port=${JPLRC_PORT}"
      # Main router (auth protected)
      - "traefik.http.routers.jplrc.rule=Host(`${JPLRC_DOMAIN}`)"
      - "traefik.http.routers.jplrc.entrypoints=${TRAEFIK_ENTRYPOINT}"
      - "traefik.http.routers.jplrc.tls.certresolver=${TRAEFIK_CERTRESOLVER}"
      - "traefik.http.routers.jplrc.middlewares=${TRAEFIK_AUTH_MIDDLEWARE}"
      # Public router for PWA assets (no auth, higher priority)
      - "traefik.http.routers.jplrc-public.rule=Host(`${JPLRC_DOMAIN}`) && (Path(`/manifest.json`) || Path(`/sw.js`) || PathPrefix(`/icon-`) || Path(`/apple-touch-icon.png`))"
      - "traefik.http.routers.jplrc-public.entrypoints=${TRAEFIK_ENTRYPOINT}"
      - "traefik.http.routers.jplrc-public.tls.certresolver=${TRAEFIK_CERTRESOLVER}"
      - "traefik.http.routers.jplrc-public.service=jplrc"
      - "traefik.http.routers.jplrc-public.priority=100"
      # home portal labels
      - "homepage.enable=true"
      - "homepage.title=歌詞ノート"
      - "homepage.description=日本語歌詞管理・ふりがな表示"
      - "homepage.icon=🎵"
      - "homepage.category=music"

  yt-sidecar:
    build: ./yt-sidecar
    container_name: yt-sidecar
    restart: unless-stopped
    env_file: .env
    networks:
      - traefik-net

volumes:
  jplrc-data:

networks:
  traefik-net:
    external: true
    name: ${TRAEFIK_NETWORK}
